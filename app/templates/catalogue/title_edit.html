{% extends "base.html" %}
{% block title %}Edit {{ title.title }} · Know Book{% endblock %}
{% block content %}
  <h1>Edit title</h1>
  <form method="post" action="{{ url_for('catalogue.update_title', title_id=title.title_id) }}" class="login-form">
    <label>ISBN <input name="isbn" value="{{ title.isbn }}" required></label>
    <label>Title <input name="title" value="{{ title.title }}" required></label>
    <label>Author <input name="author" value="{{ title.author }}" required></label>
    <label>Category <input name="category" value="{{ title.category }}" required list="category-options"></label>
    <datalist id="category-options">{% for c in categories %}<option value="{{ c }}">{% endfor %}</datalist>
    <label>Description <textarea name="description" rows="4">{{ title.description or '' }}</textarea></label>
    <label>Cover URL <input name="cover_url" value="{{ title.cover_url or '' }}"></label>
    <label class="check"><input type="checkbox" name="has_digital_version" value="1" {{ 'checked' if title.has_digital_version }}> Has digital version</label>
    <button type="submit">Save changes</button>
  </form>
  <p><a href="{{ url_for('catalogue.title_detail', title_id=title.title_id) }}">Back to title</a></p>
{% endblock %}
